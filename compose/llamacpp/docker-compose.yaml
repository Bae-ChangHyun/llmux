services:
  llama-server:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: ${CONTAINER_NAME:?CONTAINER_NAME is required — the profile env was not rendered}
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LLAMA_PORT:?LLAMA_PORT is required — the profile env was not rendered}:8080"
    volumes:
      - ${HF_CACHE_PATH:?HF_CACHE_PATH is required — .env.common was not loaded}:/root/.cache/huggingface
    environment:
      - TZ=${TZ:-UTC}
      - HF_TOKEN=${HF_TOKEN}
      - CONFIG_NAME=${CONFIG_NAME:?CONFIG_NAME is required — the profile env was not rendered}
      - NVIDIA_VISIBLE_DEVICES=${GPU_ID:?GPU_ID is required — the profile env was not rendered}
    env_file:
      - path: ${PROFILE_PATH:?PROFILE_PATH is required — the profile env was not rendered}
        required: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
