services:
  vllm:
    volumes:
      - ./scripts/vllm:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/entrypoint-wrapper.sh"]
    environment:
      - EXTRA_PIP_PACKAGES=${EXTRA_PIP_PACKAGES:-}
    env_file:
      - path: ${PROFILE_PATH:?PROFILE_PATH is required — the profile env was not rendered}
        required: true
