services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:${VLLM_VERSION:-latest}}
    container_name: ${CONTAINER_NAME}
    runtime: nvidia
    volumes:
      - ${HF_CACHE_PATH}:/root/.cache/huggingface
      - ./config/vllm:/config/
    ports:
      - "${VLLM_PORT:?VLLM_PORT is required — the profile env was not rendered}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - TZ=${TZ:-UTC}
      - NVIDIA_VISIBLE_DEVICES=${GPU_ID:?GPU_ID is required — the profile env was not rendered}
      - VLLM_ENABLE_V1_MULTIPROCESSING=0
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_DISABLE_COMPILE_CACHE=1
      - VLLM_USE_V2_MODEL_RUNNER=${VLLM_USE_V2_MODEL_RUNNER:-1}
    shm_size: "16g"
    command: --config /config/${CONFIG_NAME}.yaml --tensor-parallel-size=${TENSOR_PARALLEL_SIZE} --trust-remote-code ${LORA_OPTIONS:-}
    restart: unless-stopped
    # NOTE: GPU 노출은 `runtime: nvidia` + `NVIDIA_VISIBLE_DEVICES` 조합을 쓴다.
    # `deploy.resources.reservations.devices` 포맷은 comma-separated GPU_ID
    # (예: `0,1`) 를 list 로 풀 수 없어 multi-GPU 구성이 깨지기 때문. 같은 이유로
    # llama.cpp compose 도 동일 포맷으로 정렬돼 있다.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
