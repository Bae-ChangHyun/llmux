name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    # GitHub Actions sets CI=true, which makes Rich enable ANSI color — that
    # splits flag names like "--model" across escape codes and breaks the CLI
    # tests' plain-substring assertions. Force plain output to match a normal
    # non-TTY run.
    env:
      NO_COLOR: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          for f in compose/*/docker-compose*.yaml; do
            # `config -q` resolves interpolation, so a missing `${VAR:?...}`
            # is a failure here rather than at a user's first `up`.
            docker compose -f "$f" config -q --no-interpolate
          done
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh scripts/vllm/entrypoint-wrapper.sh
