name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    # GitHub Actions sets CI=true, which makes Rich enable ANSI color — that
    # splits flag names like "--model" across escape codes and breaks the CLI
    # tests' plain-substring assertions. Force plain output to match a normal
    # non-TTY run.
    env:
      NO_COLOR: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          export CONTAINER_NAME=test PROFILE_PATH=/tmp/profile.env HF_CACHE_PATH=/tmp/cache HF_TOKEN=

          LLAMA_PORT=8080 GPU_ID=0 docker compose \
            -f compose/llamacpp/docker-compose.yaml config -q
          LLAMA_PORT=8080 GPU_ID=0 LLAMACPP_DEV_TAG=test docker compose \
            -f compose/llamacpp/docker-compose.yaml \
            -f compose/llamacpp/docker-compose.dev.yaml config -q

          export VLLM_PORT=8000 GPU_ID=0 CONFIG_NAME=test TENSOR_PARALLEL_SIZE=1
          docker compose -f compose/vllm/docker-compose.yaml config -q
          docker compose \
            -f compose/vllm/docker-compose.yaml \
            -f compose/vllm/docker-compose.overrides.yaml config -q
          VLLM_DEV_TAG=test docker compose \
            -f compose/vllm/docker-compose.yaml \
            -f compose/vllm/docker-compose.dev.yaml config -q
          LORA_BASE_PATH=/tmp/lora docker compose \
            -f compose/vllm/docker-compose.yaml \
            -f compose/vllm/docker-compose.lora.yaml config -q

          if env -u GPU_ID docker compose -f compose/vllm/docker-compose.yaml config -q; then
            echo "compose accepted a missing required GPU_ID" >&2
            exit 1
          fi
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh scripts/vllm/entrypoint-wrapper.sh
